services:
  db:
    image: postgres:14
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jormungandr -d jormungandr"]
      interval: 5s
      timeout: 5s
      retries: 5

  jormungandr-web:
    build: .
    container_name: jormungandr-web
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend-proxy:
    image: nginx:latest
    ports:
      - "9500:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jormungandr-web

volumes:
  postgres_data:
